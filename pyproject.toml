[project]
name = "queqiao"
version = "0.1.0"
description = "QueQiao (鹊桥) - 用二维码跨 air gap 摆渡任意文件"
requires-python = ">=3.9"
dependencies = [
    "qrcode[pil]",
    "Pillow",
    "opencv-python-headless",
    "pyzbar",
]

[tool.uv]
# 这是一组脚本（encoder.py / decoder.py / ...），不是可安装的包，
# 关闭打包，让 uv 只负责管理 .venv 与依赖。
package = false
